name: build-and-release-windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.7.0-sm86)'
        required: true
        type: string

jobs:
  build:
    strategy:
      matrix:
        cuda:
          - { ver: "12.8.1.572", path: "v12.8", tag_suffix: "cuda12", archive: "ninfer-sm86-cuda12.zip" }
          - { ver: "13.3.1",      path: "v13.3", tag_suffix: "cuda13", archive: "ninfer-sm86-cuda13.zip" }
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg
          key: vcpkg-${{ hashFiles('vcpkg.json') }}-${{ runner.os }}

      - name: Cache CUDA ${{ matrix.cuda.path }}
        id: cache-cuda
        uses: actions/cache@v4
        with:
          path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\${{ matrix.cuda.path }}
          key: cuda-${{ matrix.cuda.ver }}-${{ runner.os }}

      - name: Install CUDA ${{ matrix.cuda.ver }} (choco)
        if: steps.cache-cuda.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install cuda --version=${{ matrix.cuda.ver }} -y --no-progress
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\${{ matrix.cuda.path }}"
          if (-not (Test-Path "$cudaPath\bin\nvcc.exe")) {
            Write-Error "nvcc not found at $cudaPath"
            exit 1
          }
          & "$cudaPath\bin\nvcc.exe" --version | Select-Object -First 3

      - name: Install vcpkg
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg C:\vcpkg --depth 1
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Build (sm_86, ${{ matrix.cuda.path }})
        shell: pwsh
        run: |
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\${{ matrix.cuda.path }}"
          [Environment]::SetEnvironmentVariable('CUDA_PATH', $cudaPath, 'Process')
          $verOnly = '${{ matrix.cuda.path }}' -replace '^v','' -replace '\.','_'
          [Environment]::SetEnvironmentVariable("CUDA_PATH_$verOnly", $cudaPath, 'Process')
          [Environment]::SetEnvironmentVariable('CUDA_HOME', $cudaPath, 'Process')
          [Environment]::SetEnvironmentVariable('CUDAToolkit_ROOT', $cudaPath, 'Process')
          $env:PATH = "$cudaPath\bin;$env:PATH"
          nvcc --version | Select-Object -First 3

          cmake -S . -B "build-${{ matrix.cuda.tag_suffix }}" -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_TOOLCHAIN_FILE='C:\vcpkg\scripts\buildsystems\vcpkg.cmake' `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_CUDA_ARCHITECTURES=86 `
            -DNINFER_BUILD_APPS=ON `
            -DBUILD_TESTING=OFF `
            -DNINFER_BUILD_BENCHMARKS=OFF

          cmake --build "build-${{ matrix.cuda.tag_suffix }}" --config Release --parallel

      - name: Collect & archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "build-${{ matrix.cuda.tag_suffix }}\apps\Release\ninfer.exe" dist\ 2>$null
          Copy-Item "build-${{ matrix.cuda.tag_suffix }}\apps\Release\ninfer-serve.exe" dist\ 2>$null
          Get-ChildItem "build-${{ matrix.cuda.tag_suffix }}" -Recurse -Filter '*.dll' | ForEach-Object {
            Copy-Item $_.FullName dist\ 2>$null
          }
          Copy-Item .\README.md dist\ 2>$null
          Copy-Item .\README.ko.md dist\ 2>$null
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.cuda.archive }} -Force
          Get-ChildItem dist | Select-Object Name, Length
          Write-Host "ARCHIVE_OK"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cuda.tag_suffix }}
          path: ${{ matrix.cuda.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect for release
        run: |
          mkdir release
          ls -R artifacts/
          cp artifacts/cuda12/ninfer-sm86-cuda12.zip release/ 2>/dev/null || true
          cp artifacts/cuda13/ninfer-sm86-cuda13.zip release/ 2>/dev/null || true
          ls -la release/

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.tag }}
          artifacts: "release/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true