name: build-and-release-windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.6.2-3090-patched-windows)'
        required: true
        type: string

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CUDA 12.8 (choco)
        shell: pwsh
        run: |
          choco install cuda --version=12.8.1.572 -y --no-progress
          # Verify NVCC is available (cuda package bundles the full toolkit: nvcc, cuBLAS, etc.)
          $cudaPath = 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8'
          if (-not (Test-Path "$cudaPath\bin\nvcc.exe")) {
            Write-Error "nvcc not found at $cudaPath"
            exit 1
          }
          & "$cudaPath\bin\nvcc.exe" --version | Select-Object -First 3

      - name: Install vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg C:\vcpkg --depth 1
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Build (Visual Studio 2022, x64, sm_86)
        shell: pwsh
        run: |
          $cudaPath = 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8'
          # Force env vars for CMake/MSBuild CUDA detection
          [Environment]::SetEnvironmentVariable('CUDA_PATH', $cudaPath, 'Process')
          [Environment]::SetEnvironmentVariable('CUDA_PATH_V12_8', $cudaPath, 'Process')
          [Environment]::SetEnvironmentVariable('CUDA_HOME', $cudaPath, 'Process')
          $env:PATH = "$cudaPath\bin;$env:PATH"
          nvcc --version | Select-Object -First 3

          cmake -S . -B build-windows -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_TOOLCHAIN_FILE='C:\vcpkg\scripts\buildsystems\vcpkg.cmake' `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_CUDA_ARCHITECTURES=86 `
            -DNINFER_BUILD_APPS=ON `
            -DBUILD_TESTING=OFF `
            -DNINFER_BUILD_BENCHMARKS=OFF

          cmake --build build-windows --config Release --parallel

      - name: Collect binaries & create archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build-windows\apps\Release\ninfer.exe dist\ 2>$null
          Copy-Item build-windows\apps\Release\ninfer-serve.exe dist\ 2>$null
          Get-ChildItem build-windows -Recurse -Filter '*.dll' | ForEach-Object {
            Copy-Item $_.FullName dist\ 2>$null
          }
          Copy-Item .\README.md dist\ 2>$null
          Copy-Item .\README.ko.md dist\ 2>$null
          Compress-Archive -Path dist\* -DestinationPath ninfer-3090-windows.zip -Force
          Get-Item ninfer-3090-windows.zip | Select-Object Name, Length @{N='MB';E={[math]::Round($_.Length/1MB,1)}}
          Get-ChildItem dist | Select-Object Name, Length
          Write-Host "ARCHIVE_OK"

      - name: Create Release
        if: success()
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.tag }}
          artifacts: "ninfer-3090-windows.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true